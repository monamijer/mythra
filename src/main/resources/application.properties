# --- Application ---
spring.application.name=series-tv-api
server.port=8080

# --- Local configuration ---
# Optional .env file at the project root (KEY=value lines, ignored by Git, see
# .env.example). Real environment variables work too and take precedence.
spring.config.import=optional:file:.env[.properties]

# --- MySQL / MariaDB (XAMPP) ---
# The database itself is created on first start (createDatabaseIfNotExist=true);
# its tables are then generated by Hibernate from the entities.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/series_tv_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&serverVersion=10.4.32}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: Hibernate creates the missing tables and columns from the entities.
# Convenient for this project, not recommended in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- TMDB external API ---
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY:YOUR_TMDB_API_KEY_HERE}

# --- JWT ---
# The secret is read as Base64 (at least 32 bytes once decoded). The fallback
# value only exists so that the project starts out of the box: set JWT_SECRET
# (openssl rand -base64 48) for any real use.
jwt.secret=${JWT_SECRET:2fZgkI62k7ToLGkniWBE4EV+Gq9iYzzSjDXrEJCNb7xS5Q76LH64Y92Ko2EpDlP3}
jwt.expiration-ms=86400000

# --- Initial administrator ---
# Created at startup only when the database has no administrator yet; without
# one nobody could approve the first accounts. Override these values in .env.
app.admin.email=${ADMIN_EMAIL:admin@seriestv.local}
app.admin.pseudo=${ADMIN_PSEUDO:admin}
app.admin.password=${ADMIN_PASSWORD:Admin1234!}
