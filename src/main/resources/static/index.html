<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series TV — Suivi de séries</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="image/favicon.ico" type="image/x-icon">
</head>
<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="login" class="ecran-auth">
    <div class="auth-carte">
      <h1>📺 Series TV</h1>

      <div class="auth-tabs" role="tablist" aria-label="Authentification">
        <button type="button" class="auth-tab active" data-auth="connexion"
                role="tab" aria-selected="true" aria-controls="form-connexion" id="tab-connexion">
          Connexion
        </button>
        <button type="button" class="auth-tab" data-auth="inscription"
                role="tab" aria-selected="false" aria-controls="form-inscription" id="tab-inscription">
          Inscription
        </button>
      </div>

      <form id="form-connexion" class="form-auth auth-panel active"
            role="tabpanel" aria-labelledby="tab-connexion">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email">

        <label for="login-motdepasse">Mot de passe</label>
        <input id="login-motdepasse" type="password" required autocomplete="current-password">

        <button type="submit">Se connecter</button>
      </form>

            <form id="form-inscription" class="form-auth auth-panel" hidden
            role="tabpanel" aria-labelledby="tab-inscription">
        <label for="inscription-pseudo">Pseudo</label>
        <input id="inscription-pseudo" type="text" required autocomplete="nickname">

        <label for="inscription-email">Email</label>
        <input id="inscription-email" type="email" required autocomplete="email">

        <label for="inscription-motdepasse">Mot de passe (min. 8 caractères)</label>
        <input id="inscription-motdepasse" type="password" required minlength="8" autocomplete="new-password">

        <label for="inscription-motdepasse-confirmation">Confirmer le mot de passe</label>
        <input id="inscription-motdepasse-confirmation" type="password" required minlength="8" autocomplete="new-password">

        <button type="submit">S'inscrire</button>
      </form>

      <p id="login-erreur" class="erreur" role="alert" aria-live="assertive"></p>
      <p id="login-succes" class="succes hidden" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- ===== APPLICATION ===== -->
  <div id="app" class="hidden">
    <a class="skip-link" href="#contenu-principal">Aller au contenu</a>
    <header class="app-header">
      <div class="header-inner">
        <button id="btn-menu" class="icon-btn" type="button" aria-label="Ouvrir le menu"
                aria-controls="drawer" aria-expanded="false" aria-haspopup="dialog">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <a class="brand" href="#" data-tab="mes-series" aria-label="Series TV — accueil">
          <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
            <rect x="2" y="5" width="28" height="19" rx="5" fill="currentColor"/>
            <path d="M13 10.5v8l7-4z" fill="var(--hdr-bg-solid)"/>
            <rect x="9" y="26.5" width="14" height="2.5" rx="1.25" fill="currentColor"/>
          </svg>
          <span class="brand-text">Series<span>TV</span></span>
        </a>

        <nav class="primary-nav" aria-label="Sections principales">
          <button class="tab-btn active" data-tab="mes-series" id="onglet-mes-series" aria-current="page" type="button">
            <i class="bi bi-collection-play" aria-hidden="true"></i> Mes séries
          </button>
          <button class="tab-btn" data-tab="decouvrir" id="onglet-decouvrir" type="button">
            <i class="bi bi-compass" aria-hidden="true"></i> Découvrir
          </button>
          <button class="tab-btn" data-tab="stats" id="onglet-stats" type="button">
            <i class="bi bi-bar-chart-line" aria-hidden="true"></i> Stats
          </button>
          <button class="tab-btn admin-only hidden" data-tab="admin" id="onglet-admin" type="button">
            <i class="bi bi-shield-lock" aria-hidden="true"></i> Admin
          </button>
        </nav>

        <div class="header-user">
          <button id="btn-theme" class="icon-btn" type="button"
                  aria-label="Basculer le thème" title="Basculer clair / sombre">
            <i class="bi bi-moon-stars" aria-hidden="true"></i>
          </button>
          <div class="user-chip">
            <span class="user-avatar" id="avatar-utilisateur" aria-hidden="true">?</span>
            <span id="nom-utilisateur"></span>
            <span id="badge-role"></span>
          </div>
          <button id="btn-deconnexion" class="icon-btn icon-btn-text" type="button" aria-label="Déconnexion" title="Déconnexion">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            <span class="hide-sm">Déconnexion</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ===== NAVIGATION DRAWER ===== -->
    <div id="drawer-overlay" class="drawer-overlay" hidden></div>
    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-titre" inert>
      <div class="drawer-head">
        <span class="drawer-user" id="drawer-titre">
          <span class="user-avatar" id="drawer-avatar" aria-hidden="true">?</span>
          <span id="drawer-pseudo">Menu</span>
        </span>
        <button id="btn-menu-fermer" class="icon-btn" type="button" aria-label="Fermer le menu">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
      <nav class="drawer-body" aria-label="Navigation complète">
        <section class="drawer-section" aria-labelledby="dr-lib">
          <h2 id="dr-lib"><i class="bi bi-collection-play" aria-hidden="true"></i> Ma bibliothèque</h2>
          <ul>
            <li><button type="button" class="drawer-link" data-tab="mes-series" data-statut="">Toutes mes séries</button></li>
            <li><button type="button" class="drawer-link" data-tab="mes-series" data-statut="A_VOIR">À voir</button></li>
            <li><button type="button" class="drawer-link" data-tab="mes-series" data-statut="EN_COURS">En cours</button></li>
            <li><button type="button" class="drawer-link" data-tab="mes-series" data-statut="TERMINEE">Terminées</button></li>
            <li><button type="button" class="drawer-link" data-tab="mes-series" data-statut="ABANDONNEE">Abandonnées</button></li>
          </ul>
        </section>
        <section class="drawer-section" aria-labelledby="dr-dec">
          <h2 id="dr-dec"><i class="bi bi-compass" aria-hidden="true"></i> Découverte</h2>
          <ul>
            <li><button type="button" class="drawer-link" data-tab="decouvrir">Découvrir des séries</button></li>
            <li><button type="button" class="drawer-link" data-tab="decouvrir" data-cat="populaires">Populaires</button></li>
            <li><button type="button" class="drawer-link" data-tab="decouvrir" data-cat="tendances">Tendances</button></li>
            <li><button type="button" class="drawer-link" data-tab="decouvrir" data-cat="mieux-notees">Mieux notées</button></li>
            <li><button type="button" class="drawer-link" data-tab="decouvrir" data-cat="diffusees-bientot">Bientôt diffusées</button></li>
            <li><button type="button" class="drawer-link" data-tab="decouvrir" data-focus="input-acteur">Rechercher un acteur</button></li>
          </ul>
        </section>
        <section class="drawer-section" aria-labelledby="dr-ins">
          <h2 id="dr-ins"><i class="bi bi-bar-chart-line" aria-hidden="true"></i> Statistiques</h2>
          <ul>
            <li><button type="button" class="drawer-link" data-tab="stats">Mes statistiques</button></li>
          </ul>
        </section>
        <section class="drawer-section admin-only hidden" aria-labelledby="dr-adm">
          <h2 id="dr-adm"><i class="bi bi-shield-lock" aria-hidden="true"></i> Administration</h2>
          <ul>
            <li><button type="button" class="drawer-link" data-tab="admin">Tableau de bord &amp; utilisateurs</button></li>
          </ul>
        </section>
      </nav>
      <div class="drawer-foot">
        <button id="btn-theme-drawer" class="drawer-foot-btn" type="button"><i class="bi bi-moon-stars" aria-hidden="true"></i> Thème clair / sombre</button>
        <button id="btn-deconnexion-drawer" class="drawer-foot-btn" type="button"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Déconnexion</button>
      </div>
    </aside>

    <main id="contenu-principal" tabindex="-1">
      <!-- ===== MES SÉRIES ===== -->
      <section id="mes-series" class="tab-panel active" role="tabpanel"
               aria-labelledby="onglet-mes-series" tabindex="0">

        <form id="form-ajout-serie" class="card form-inline">
          <label for="input-titre" class="sr-only">Titre de la série</label>
          <input type="text" id="input-titre" placeholder="Titre de la série" required>

          <label for="input-genre" class="sr-only">Genre</label>
          <input type="text" id="input-genre" placeholder="Genre">

          <button type="submit">Ajouter</button>
        </form>

                <div class="card form-inline">
          <label for="select-tri" class="sr-only">Trier par</label>
          <select id="select-tri">
            <option value="titre-asc">Titre (A→Z)</option>
            <option value="titre-desc">Titre (Z→A)</option>
            <option value="annee-desc">Année (récente)</option>
            <option value="annee-asc">Année (ancienne)</option>
            <option value="note-desc">Note (meilleure)</option>
            <option value="progression-desc">Progression (élevée)</option>
          </select>

          <label for="input-filtre-genre" class="sr-only">Filtrer par genre</label>
          <input type="text" id="input-filtre-genre" placeholder="Filtrer par genre...">

          <label for="select-filtre-statut" class="sr-only">Filtrer par statut</label>
          <select id="select-filtre-statut">
            <option value="">Tous les statuts</option>
            <option value="A_VOIR">À voir</option>
            <option value="EN_COURS">En cours</option>
            <option value="TERMINEE">Terminée</option>
            <option value="ABANDONNEE">Abandonnée</option>
          </select>
        </div>

        <div id="liste-series" class="grid" aria-live="polite"></div>
      </section>

      <!-- ===== DÉCOUVRIR ===== -->
      <section id="decouvrir" class="tab-panel" role="tabpanel"
               aria-labelledby="onglet-decouvrir" tabindex="0" hidden>

        <form id="form-recherche-acteur" class="card form-inline">
          <label for="input-acteur" class="sr-only">Rechercher un acteur</label>
          <input type="text" id="input-acteur" placeholder="Rechercher un acteur...">
          <button type="submit">Rechercher</button>
        </form>

        <div id="resultats-acteurs" class="grid" aria-live="polite"></div>

        <div class="sous-nav" role="group" aria-label="Catégories de séries">
          <button type="button" class="souscat-btn" data-cat="populaires">Populaires</button>
          <button type="button" class="souscat-btn" data-cat="tendances">Tendances</button>
          <button type="button" class="souscat-btn" data-cat="mieux-notees">Mieux notées</button>
          <button type="button" class="souscat-btn" data-cat="diffusees-bientot">Bientôt</button>
        </div>

        <form id="form-recherche-tmdb" class="card form-inline">
          <label for="input-recherche" class="sr-only">Rechercher une série</label>
          <input type="text" id="input-recherche" placeholder="Rechercher une série...">
          <button type="submit">Rechercher</button>
        </form>

        <form id="form-decouvrir" class="card form-inline">
          <label for="select-genre" class="sr-only">Genre</label>
          <select id="select-genre">
            <option value="">Tous les genres</option>
          </select>

          <label for="input-annee" class="sr-only">Année</label>
          <input type="number" id="input-annee" placeholder="Année" min="1900" max="2100">

          <label for="input-note-min" class="sr-only">Note minimale</label>
          <input type="number" id="input-note-min" placeholder="Note min." min="0" max="10" step="0.5">

          <button type="submit">Filtrer</button>
        </form>

        <div id="resultats-tmdb" class="grid" aria-live="polite"></div>

        <nav id="pagination-tmdb" class="pagination hidden" aria-label="Pagination des résultats">
          <button type="button" id="btn-page-prec" class="btn-page">← Précédent</button>
          <span id="info-page" class="info-page" aria-live="polite">Page 1 / 1</span>
          <button type="button" id="btn-page-suiv" class="btn-page">Suivant →</button>
        </nav>
      </section>
            <!-- ===== STATS ===== -->
      <section id="stats" class="tab-panel" role="tabpanel"
               aria-labelledby="onglet-stats" tabindex="0" hidden>
        <div id="stats-contenu" aria-live="polite"></div>
      </section>

      <!-- ===== ADMIN ===== -->
      <section id="admin" class="tab-panel" role="tabpanel"
               aria-labelledby="onglet-admin" tabindex="0" hidden>

        <div id="admin-stats" class="admin-stats"></div>

        <div class="card form-inline">
          <label for="select-statut-admin" class="sr-only">Filtrer par statut</label>
          <select id="select-statut-admin">
            <option value="">Tous les utilisateurs</option>
            <option value="EN_ATTENTE">En attente</option>
            <option value="APPROUVE">Approuvés</option>
            <option value="REFUSE">Refusés</option>
          </select>
          <button type="button" id="btn-rafraichir-admin">Rafraîchir</button>
        </div>

        <div id="admin-liste" class="admin-liste" aria-live="polite"></div>
      </section>
    </main>

    <div id="panneau-detail" class="panneau-detail hidden"
         role="dialog" aria-modal="true" aria-labelledby="titre-detail">
      <div class="panneau-contenu">
        <button id="btn-fermer-panneau" class="btn-fermer"
                aria-label="Fermer la fenêtre de détail">&times;</button>
        <div id="detail-contenu"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
